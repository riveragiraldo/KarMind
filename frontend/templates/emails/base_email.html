{% load static %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}KarMind - Comunicación{% endblock %}</title>
    
    <!-- Tipografía Inter (aunque muchos clientes la ignoran, la ponemos como fallback) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos de Email: DEBEN SER INLINE y usar colores de marca -->
    <style type="text/css">
        /* Reset CSS general */
        body { margin: 0; padding: 0; min-width: 100%; background-color: #0F172A; }
        table { border-collapse: collapse; table-layout: fixed; }
        a { color: #3B82F6; text-decoration: none; }
        
        /* Tipografía e identidad KarMind */
        .kar-font { font-family: 'Inter', sans-serif; }
        
        /* Contenedor Principal (Cuerpo del Email) */
        .kar-body { background-color: #0F172A; color: #E2E8F0; padding: 20px; }
        
        /* Contenedor de la Tarjeta (El contenido principal) */
        .kar-card {
            background-color: #1E293B; /* Fondo interior más claro que el body */
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        /* Títulos */
        .kar-h1 { color: #E2E8F0; font-size: 24px; font-weight: 700; margin: 0; padding: 0; }
        .kar-h2 { color: #94A3B8; font-size: 18px; font-weight: 600; margin: 0; padding: 0; }

        /* Párrafos */
        .kar-p { color: #94A3B8; font-size: 15px; line-height: 1.6; margin: 0 0 16px 0; }

        /* Botón de Acento (Verde/Cian) */
        .kar-btn-accent {
            background-color: #10B981; /* kar-accent */
            border-radius: 8px;
            color: #1F2937; /* Texto oscuro sobre el acento */
            display: inline-block;
            font-size: 16px;
            font-weight: 700;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.4);
        }
        
        /* Enlaces de Texto */
        .kar-link { color: #3B82F6; text-decoration: none; font-weight: 600; }

        /* Footer y texto legal */
        .kar-footer { color: #475569; font-size: 12px; line-height: 1.5; text-align: center; }
        .kar-footer a { color: #475569; text-decoration: underline; }

        /* Estilo para los datos de contacto/meta */
        .kar-data-label { color: #94A3B8; font-weight: 600; }
        .kar-data-value { color: #E2E8F0; font-weight: 400; }

    </style>
</head>
<body class="kar-body" style="background-color: #0F172A; margin: 0; padding: 0; min-width: 100%;">
    <center class="kar-font" style="width: 100%;">
        <div style="max-width: 600px; margin: auto;">

            <!-- PRE HEADER (Oculto) -->
            <div style="font-size: 1px; color: #0F172A; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden;">
                {% block preheader %}{% endblock %}
            </div>

            <!-- TABLA PRINCIPAL DEL EMAIL (CENTRAL CARD) -->
            <table cellpadding="0" cellspacing="0" border="0" width="100%" class="kar-card" style="background-color: #1E293B; border-radius: 12px; border: 1px solid #334155;">
                
                <!-- HEADER (Logo y Nombre) -->
                <tr>
                    <td class="kar-card-padding" style="padding: 24px 24px 16px 24px; border-bottom: 1px solid #334155;">
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="text-align: left;">
                                    <span class="kar-h1" style="font-family: 'Inter', sans-serif; color: #E2E8F0; font-size: 24px; font-weight: 800;">
                                        <span style="color: #3B82F6;">Kar</span><span style="color: #10B981;">Mind</span>
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CONTENIDO DINÁMICO (MENSAJE) -->
                <tr>
                    <td style="padding: 24px; word-break: break-word;" class="kar-font">
                        {{ mensaje|safe }}
                    </td>
                </tr>
            </table>

            <!-- FOOTER LEGAL -->
            <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top: 20px;">
                <tr>
                    <td class="kar-footer" style="padding: 0 20px;">
                        <p style="color: #475569; font-size: 12px; line-height: 1.5; margin: 0 0 8px 0;">
                            Este es un mensaje automatizado de KarMind.
                            <br>
                            Derechos Reservados © {% now "Y" %} | <a href="#" style="color: #475569;">Política de Datos</a>
                        </p>
                        {% block legal_hash %}{% endblock %}
                    </td>
                </tr>
            </table>

        </div>
    </center>
</body>
</html>
